name: Apply pipeline hardening patch

on:
  push:
    branches: [fix/pipeline-state-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'feat: apply turn state atomically')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun run scripts/_apply-pipeline-hardening.mjs
