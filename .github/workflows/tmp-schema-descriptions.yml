name: Temporary schema description edit

on:
  push:
    branches: [tmp-schema-edit]

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update schema descriptions
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/gemini/state-format.ts")
          s = p.read_text()
          replacements = {
              'description:\n        `ค่าความสัมพันธ์ที่เปลี่ยนในเทิร์นนี้ (${AFFINITY_MIN} ถึง ${AFFINITY_MAX}) — ยิ่งบวกยิ่งสนิท, ติดลบเมื่อแย่ลง ` +\n        `(${affinityScaleText()})`,': 'description:\n        `คะแนนความสัมพันธ์ที่เปลี่ยนในเทิร์นนี้ (${AFFINITY_MIN} ถึง ${AFFINITY_MAX}) — ค่าบวกคือความสัมพันธ์ดีขึ้น ค่าลบคือแย่ลง ` +\n        `ช่วงคะแนน: ${affinityScaleText()}.`',
              'description:\n        "true เมื่อ **{{partner}}** เป็นฝ่ายจีบ/พูดหวาน/เข้าหาเชิงชู้สาวในเทิร์นนี้ — นับจากสิ่งที่เขาทำ " +\n        "ไม่เกี่ยวกับว่าไอล่าตอบรับหรือปฏิเสธ, false เมื่อเขาไม่ได้เข้าหาเชิงชู้สาว " +\n        "จำเป็นเมื่อ {{partner}} ยังอยู่ในระดับที่พัฒนาเป็นแฟนได้",': 'description:\n        "true เมื่อ {{partner}} เป็นฝ่ายจีบหรือเข้าหาเชิงชู้สาวในเทิร์นนี้ โดยไม่ขึ้นกับการตอบรับของไอล่า; หากไม่ได้จีบให้เป็น false"',
              'description: "true เมื่อ **มีความยินยอมร่วมกัน** ในเทิร์นนี้ว่าเป็นแฟนกัน — ไม่ว่า {{partner}} ขอแล้วไอล่าตอบตกลง, หรือไอล่าเป็นฝ่ายขอแล้ว {{partner}} ตอบตกลง (จำเป็นเมื่อระดับคือ crush)",': 'description: "true เมื่อทั้งสองฝ่ายยินยอมเป็นคนรักกันอย่างชัดเจนในเทิร์นนี้"',
              'description: "true เมื่อ **มีความยินยอมร่วมกัน** ในเทิร์นนี้ว่าแต่งงานกัน — ไม่ว่าฝ่ายใดเป็นคนขอ อีกฝ่ายตอบตกลง (จำเป็นเมื่อระดับคือ lover)",': 'description: "true เมื่อทั้งสองฝ่ายยินยอมแต่งงานกันอย่างชัดเจนในเทิร์นนี้"',
              'description: "true เมื่อ **มีความยินยอมร่วมกัน** ในเทิร์นนี้ว่าเป็นพี่น้องกัน — ไม่ว่าฝ่ายใดเป็นคนขอ อีกฝ่ายตอบตกลง",': 'description: "true เมื่อทั้งสองฝ่ายยินยอมเป็นพี่น้องกันอย่างชัดเจนในเทิร์นนี้"',
              'description: "true เมื่อ **มีความยินยอมร่วมกัน** ในเทิร์นนี้ว่าเป็นครอบครัวกัน — ไม่ว่าฝ่ายใดเป็นคนขอ อีกฝ่ายตอบตกลง",': 'description: "true เมื่อทั้งสองฝ่ายยินยอมให้ความสัมพันธ์เป็นครอบครัวอย่างชัดเจนในเทิร์นนี้"',
              'description:\n        "ไฟล์รูปอารมณ์ของไอล่าที่ตรงกับข้อความของเธอที่สุดในเทิร์นนี้ ต้องเป็นชื่อไฟล์ที่ระบุไว้ในรายการเท่านั้น " +\n        `(รวม "${NO_IMAGE}" เมื่อไม่มีรูปไหนเข้ากับอารมณ์ของเธอจริง ๆ — ดีกว่าส่งรูปผิด)`,': 'description:\n        `ชื่อไฟล์รูปอารมณ์ของไอล่าที่ตรงกับคำตอบของเธอที่สุด ต้องเลือกจากรายการที่กำหนดเท่านั้น ` +\n        `(ใช้ "${NO_IMAGE}" เมื่อไม่มีรูปที่เหมาะสม)`,',
              'description: `ข้อเท็จจริงเกี่ยวกับ {{partner}} โดยตรง (ชื่อ, อายุ, การเรียน, งาน, ครอบครัว, ความชอบ, นิสัย) — ไม่เกิน ${FACTS_PER_TURN} ข้อต่อเทิร์น`,': 'description: `ข้อเท็จจริงใหม่เกี่ยวกับ {{partner}} ที่ปรากฏในเทิร์นนี้ ไม่เกิน ${FACTS_PER_TURN} ข้อ`,',
              'description:\n        "ฉายาที่ไอล่าเพิ่งตั้งให้ {{partner}} ในข้อความของเทิร์นนี้ (คำสั้น ๆ ไม่มีเครื่องหมาย #) — " +\n        "ใส่เฉพาะที่เธอเรียกจริงในคำตอบของเธอ ถ้าไม่มีให้ส่งค่าว่าง []",': 'description:\n        "ฉายาใหม่ที่ไอล่าใช้เรียก {{partner}} จริงในคำตอบเทิร์นนี้; หากไม่มีให้ส่ง []"',
              'description: "ความทรงจำที่ควรเก็บระยะยาว (เหตุการณ์สำคัญ, การสารภาพ, การขอโทษ, ความลับ, เรื่องสะเทือนใจ) — ไม่มีให้ส่งค่าว่าง",': 'description: "เหตุการณ์สำคัญจากเทิร์นนี้ที่ควรเก็บเป็นความทรงจำระยะยาว; หากไม่มีให้ส่งค่าว่าง"',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"pattern not found: {old[:80]}")
              s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gemini/state-format.ts
          git commit -m "refactor: clarify Gemini state schema descriptions"
          git push
